[project]
name = "bizassist_ai"
version = "0.1.0"
description = "RAG-based AI Business Knowledge & Customer Support Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "uvicorn>=0.54.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "huggingface-hub>=2.1.1",
    "python-dotenv>=1.2.4",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "faiss-cpu>=1.15.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/bizassist_ai"]
